<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Conversor de Taxas CDI </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="shared.js"></script>
    <script src="layout.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    <div id="app"></div>
    <script>
        const prazoOptions = `
            <option value="0">sem IR (0%)</option>
            <option value="0.225">Até 6 meses (22,5%)</option>
            <option value="0.20">De 6 meses até 1 ano (20%)</option>
            <option value="0.175">De 1 ano a 2 anos (17,5%)</option>
            <option value="0.15">Acima de 2 anos (15%)</option>
        `;
        
        const inputsHTML = `
            ${createInputHTML('select', 'prazo', 'Tempo do Investimento (IR)', '', prazoOptions)}
            ${createInputHTML('number', 'taxaBruta', 'Taxa Bruta Anual (%)', '100.00', 'step="1"')}
            ${createInputHTML('number', 'cdiAtual', 'CDI Atual (%)', '14.15', 'step="0.1"')}
        `;
        
        const tableHTML = createTableHTML([
            { text: 'CDI (Ano)' },
            { text: 'CDI Bruto %' },
            { text: 'Taxa LCA %' },
            { text: 'LCA Líquido %', highlight: true }
        ]);

        renderLayout({
            currentPage: 'cdi',
            title: 'Conversor de Taxas Prefixadas',
            subtitle: 'Compare rendimentos CDI vs. LCA',
            inputsHTML,
            tableHTML,
            maxWidth: 'max-w-4xl'
        });

        const inputTaxa = document.getElementById('taxaBruta');
        const inputCdi = document.getElementById('cdiAtual');
        const selectPrazo = document.getElementById('prazo');
        const resultadoCorpo = document.getElementById('resultado-corpo');

        function criarLinha(cdiAno, destaque) {
            const aliquota = parseFloat(selectPrazo.value);
            const cdiAtual = parseFloat(inputCdi.value) || 0;
            const cdiBruto = cdiAno * (cdiAtual / 100);
            const taxaLca = cdiAno * (1 - aliquota);
            const lcaLiquido = cdiBruto * (1 - aliquota);
            
            const { rowClass, textClass } = getRowClasses(destaque);
            return `<tr class="${rowClass}"><td class="px-4 py-4 font-medium ${textClass}">${formatPercent(cdiAno)}</td><td class="px-4 py-4 ${textClass}">${formatPercent(cdiBruto)}</td><td class="px-4 py-4 ${textClass}">${formatPercent(taxaLca)}</td><td class="px-4 py-4 font-bold text-green-600 dark:text-green-400">${formatPercent(lcaLiquido)}</td></tr>`;
        }

        function calcular() {
            const bruta = parseFloat(inputTaxa.value) || 0;
            resultadoCorpo.innerHTML = gerarLinhasGenerico(bruta, 1, criarLinha);
        }

        inputTaxa.addEventListener('input', calcular);
        inputCdi.addEventListener('input', calcular);
        selectPrazo.addEventListener('change', calcular);

        initDarkMode();
        calcular();
    </script>
</body>
</html>
