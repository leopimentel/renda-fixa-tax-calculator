<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Taxas Prefixadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="shared.js"></script>
    <script src="layout.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    <div id="app"></div>
    <script>
        const aliquotas = [0.225, 0.20, 0.175, 0.15];
        const inputsHTML = createInputHTML('number', 'taxaBruta', 'Taxa Bruta Anual (%)', '12.00', 'step="0.1"');
        const tableHTML = createTableHTML([
            { text: 'Taxa Bruta' },
            { text: '22,5% até 6 meses' },
            { text: '20% até 1 ano' },
            { text: '17,5% 1 ano até 2 anos' },
            { text: '15% Acima de 2 anos', highlight: true }
        ]);

        renderLayout({
            currentPage: 'prefixada',
            title: 'Conversor de Taxas Prefixadas',
            subtitle: 'Compare rendimentos brutos vs. líquidos',
            inputsHTML,
            tableHTML,
            maxWidth: 'max-w-2xl'
        });

        const inputTaxa = document.getElementById('taxaBruta');
        const resultadoCorpo = document.getElementById('resultado-corpo');

        function criarLinha(taxaBruta, destaque) {
            const { rowClass, textClass } = getRowClasses(destaque);
            const liquidas = aliquotas
                .map(ir => formatPercent(taxaBruta * (1 - ir)))
                .map(value => `<td class="px-4 py-4 ${textClass}">${value}</td>`)
                .join('');
            return `<tr class="${rowClass}"><td class="px-4 py-4 font-medium ${textClass}">${formatPercent(taxaBruta)}</td>${liquidas}</tr>`;
        }

        function calcular() {
            resultadoCorpo.innerHTML = gerarLinhasGenerico(parseFloat(inputTaxa.value) || 0, 0.5, criarLinha);
        }

        inputTaxa.addEventListener('input', calcular);
        initDarkMode();
        calcular();
    </script>
</body>
</html>
